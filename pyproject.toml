[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sve"
version = "0.1.0"
description = "Biomimetic activation-steering framework for LLM safety. Translates autonomic nervous system regulation into continuous, dynamic vector steering in residual activation space."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "nate086"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = ["sve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
